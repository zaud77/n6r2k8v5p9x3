name: Migrate public kernel history
'on':
  workflow_dispatch:
    inputs:
      build_request_id:
        description: Migration verification identity
        type: string
        default: kernel66-source-migration
permissions:
  contents: read
  actions: write
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Prepare pinned build inputs
      uses: ./.github/actions/private-inputs
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        revision: ${{ secrets.SOURCE_REVISION }}
        key: ${{ secrets.SOURCE_READ_KEY }}
        submodules: 'false'
        dependency-keys: ${{ secrets.DEPENDENCY_SSH_KEYS }}
        privacy-key: ${{ secrets.BUILD_PRIVACY_KEY }}
    - name: Run private build pipeline
      id: pipeline
      uses: ./ci/actions/migrate_kernel66/migrate
      with:
        build_request_id: ${{ inputs.build_request_id }}
        artifact_token: ${{ secrets.BUILD_DIAGNOSTICS_TOKEN }}
    - name: Save private encrypted build diagnostics
      if: ${{ always() && steps.pipeline.outcome != 'skipped' }}
      shell: bash
      run: python3 "$GITHUB_WORKSPACE/ci/run_pipeline_step.py" --publish-diagnostics
      env:
        DIAGNOSTICS_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
        BUILD_DIAGNOSTICS_TOKEN: ${{ secrets.BUILD_DIAGNOSTICS_TOKEN }}
        DIAGNOSTICS_JOB_INDEX: ${{ strategy.job-index || 0 }}
    - name: Clear dependency access
      if: ${{ always() }}
      uses: ./.github/actions/dependency-access
      with:
        cleanup: 'true'
